[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esm-scenario-preprocessing"
version = "0.1.0"
description = "Preprocessing tools for ESM scenario input data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyam-iamc",
  "marimo",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
