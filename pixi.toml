[workspace]
name = "esm-scenario-preprocessing"
version = "0.1.0"
description = "Preprocessing tools for ESM scenario input data"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
marimo = "*"


[pypi-dependencies]
pandas = ">=1.0.0"
pyam-iamc = ">=2.0.0"
nomenclature-iamc = ">=0.29"
